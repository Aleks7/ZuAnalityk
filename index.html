<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Squad Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="400" height="700"></canvas>

    <div id="hud">
      <div class="pill" id="hudLevel">Poziom 1</div>
      <div class="pill" id="hudScore">0 pkt</div>
    </div>
    <div id="progress"><div id="progressBar"></div></div>

    <div id="overlay" class="overlay">
      <h1>SQUAD RUSH</h1>
      <p>Prowadź oddział w górę, strzelaj do wrogów<br>i wybieraj bramki z ulepszeniami: <b>lewo</b> albo <b>prawo</b>.</p>
      <p class="small">Sterowanie: przeciągnij palcem / myszką albo ← → / A D.<br>Strzelaj w bramki, żeby podbić ich wartość!</p>
      <p class="small" id="best"></p>
      <button id="startBtn">GRAJ</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
